[package]
name = "app"
version = "2.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0.133"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.28", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
once_cell = "1.21.3"
parking_lot = "0.12"
global-hotkey = "0.7"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "winbase", "windef", "wingdi", "commctrl", "combaseapi", "objbase", "mmdeviceapi", "audioclient", "audiosessiontypes", "mmreg", "winerror"] }
windows = { version = "0.62.1", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
rdev = "0.5.3"
cpal = "0.16.0"
hound = "3.5.1"
anyhow = "1"
whisper-rs = { version = "0.15", optional = true }
num_cpus = "1"
num-traits = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

[features]
default = ["transcription"]
transcription = ["whisper-rs"]
