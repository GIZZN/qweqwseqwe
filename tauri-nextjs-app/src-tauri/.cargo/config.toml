[build]
# Limit parallel jobs to avoid system freeze during compilation
# Set to half your CPU cores (e.g. 4 cores → 2 jobs)
jobs = 2

[profile.release]
# Faster linking — reduces RAM usage during build
lto = false
codegen-units = 4
opt-level = 2

[env]
# whisper-rs-sys forwards any CMAKE_* env var as a -D cmake define.
# On the Visual Studio (multi-config) generator the cmake crate overwrites
# CMAKE_CXX_FLAGS_RELEASE with minimal flags and drops the default /O2,
# making the release whisper.cpp ~10x slower than the dev (RelWithDebInfo) build.
# Restore full optimization for the Release config explicitly.
CMAKE_C_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/O2 /Ob2 /DNDEBUG"
